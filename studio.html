<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SoundWave UI Studio</title><link rel="stylesheet" href="studio.css"></head><body><div id="device" class="device">
<div class="status"><span>9:41</span><span class="status-right">▂▄▆  ◕  ▰</span></div>
<div class="content" id="content"></div>
<div id="bottom"></div>
</div>
<script>
const c='/assets/covers/';
const icons={play:'▶',music:'♫',heart:'♡',search:'⌕',next:'⏭',pause:'Ⅱ',settings:'⚙',back:'‹',more:'⋮',crown:'♛'};
const img=(name,cls='')=>`<img class="${cls}" src="assets/covers/${name}.jpg" alt="">`;
const bar=(n)=>Array.from({length:n},(_,i)=>`<i style="--h:${18+Math.floor(45*Math.abs(Math.sin(i*.66)) + 10*Math.abs(Math.cos(i*1.77)))}px"></i>`).join('');
const nav=(active='Home')=>`<div class="nav">${[['⌂','Home'],['⌕','Entdecken'],['▥','Bibliothek'],['♛','Premium']].map(([i,t])=>`<div class="navitem ${active===t?'active':''}"><span>${i}</span><small>${t}</small></div>`).join('')}</div>`;
const mini=`<div class="mini"><img src="assets/covers/06_neon_pulse.jpg"><div><strong>Neon Horizon</strong><small>Demo-Track</small></div><span>❚❚</span><span>⏭</span></div>`;
const screen={
home:`<header class="tophead"><span class="circlebtn">☰</span><img src="assets/icons/01_neon_note_512.png" class="brandmark"><span class="circlebtn">⚙</span></header><section class="hero"><div class="eyebrow">DEIN PERSÖNLICHER MUSIKPLAYER</div><h1>Good <em>Vibes.</em></h1><p>Musik für jeden Moment.</p></section><div class="search">⌕ &nbsp; Songs, Künstler, Playlists suchen</div><div class="chips"><span class="on">Für dich</span><span>Chill</span><span>Workout</span><span>Party</span><span>Focus</span></div><div class="upload"><div class="uploadicon">♫</div><div><strong>Deine Musik</strong><small>Eigene Songs importieren und offline hören</small></div><b>＋</b></div><div class="sect"><h2>Deine Playlists</h2><a>Alle anzeigen ›</a></div><div class="playlistrow"><div>${img('01_chill_vibes')}<strong>Chill Vibes</strong><small>Entspannte Klänge</small></div><div>${img('02_workout')}<strong>Workout</strong><small>Dein Power-Mix</small></div><div>${img('03_party_hits')}<strong>Party Hits</strong><small>Volle Energie</small></div></div><div class="sect"><h2>Für deinen Moment</h2><a>Entdecken ›</a></div><div class="featured">${img('04_aurora')}<div><div class="eyebrow">ATMOSPHÄRISCH</div><h3>Aurora Dreams</h3><p>Deine Auszeit vom Alltag.</p></div><span>▶</span></div>`,
discover:`<header class="simpletop"><span>⌕</span><b>Entdecken</b><span>☷</span></header><div class="hero minor"><div class="eyebrow">FINDE DEINEN SOUND</div><h1>Neue <em>Welten.</em></h1><p>Playlists für jeden Vibe.</p></div><div class="search">⌕ &nbsp; Songs, Genres und Stimmungen</div><div class="chips"><span class="on">Alles</span><span>Chill</span><span>Focus</span><span>Party</span><span>Electronic</span></div><div class="sect"><h2>Musik für jeden Mood</h2><a>Alle ›</a></div><div class="discovergrid">${[['01_chill_vibes','Chill Vibes','Runterkommen'],['02_workout','Workout','Neue Energie'],['03_party_hits','Party Hits','Lauter leben'],['04_aurora','Ambient Dreams','Tiefe Klangwelten'],['05_vinyl','Vinyl Nights','Retro & warm'],['06_neon_pulse','Neon Pulse','Elektronische Beats']].map(([im,t,d])=>`<article>${img(im)}<strong>${t}</strong><small>${d}</small></article>`).join('')}</div>`,
library:`<header class="simpletop"><span>‹</span><b>Meine Musik</b><span>⋮</span></header><div class="hero minor"><div class="eyebrow">DEINE MUSIK. DEINE REGELN.</div><h1>Meine <em>Musik.</em></h1><p>Deine Sammlung, immer dabei.</p></div><div class="chips"><span class="on">Songs</span><span>Alben</span><span>Künstler</span><span>Ordner</span></div><div class="bigupload">＋ &nbsp; Songs hinzufügen</div><div class="librarymeta"><b>Deine Sammlung</b><span>Sortieren ↓</span></div><div class="tracks">${[['06_neon_pulse','Neon Horizon','Demo-Track','3:42'],['04_aurora','Midnight Aurora','Demo-Track','4:16'],['01_chill_vibes','Between Waves','Demo-Track','3:18'],['02_workout','Electric Motion','Demo-Track','2:58'],['03_party_hits','Afterglow','Demo-Track','3:35'],['05_vinyl','Retro Skyline','Demo-Track','4:12']].map(([im,t,ar,d])=>`<div class="track">${img(im)}<div><strong>${t}</strong><small>${ar} · ${d}</small></div><span>⋮</span></div>`).join('')}</div><p class="subhint">Beispieldaten · Eigene Songs über den Dateipicker hinzufügen</p>`,
player:`<header class="simpletop"><span>⌄</span><b>Jetzt läuft</b><span>⋮</span></header><div class="playerglow"></div><div class="bigcover">${img('06_neon_pulse')}</div><div class="playerinfo"><div><h1>Neon Horizon</h1><p>Demo-Track · Deine Musik</p></div><span>♡</span></div><div class="waveform">${bar(44)}</div><div class="timing"><span>1:42</span><span>3:42</span></div><div class="playercontrols"><span>⤨</span><span>⏮</span><span class="playbtn">Ⅱ</span><span>⏭</span><span>↻</span></div><div class="playeractions"><div><b>▣</b><small>Lyrics</small></div><div><b>☷</b><small>Equalizer</small></div><div><b>◷</b><small>Sleep-Timer</small></div><div><b>↥</b><small>Teilen</small></div></div><div class="audionote">♪ &nbsp; Kristallklarer Sound · Individueller Style</div>`,
eq:`<header class="simpletop"><span>‹</span><b>Equalizer</b><span class="toggle"><i></i></span></header><div class="hero minor"><div class="eyebrow">AUDIO STUDIO</div><h1>Dein <em>Sound.</em></h1><p>Fein abgestimmt auf deinen Geschmack.</p></div><div class="selectp">♫ &nbsp; Electronic <span>⌄</span></div><div class="equalizer"><div class="dbscale"><span>+12</span><span>0</span><span>-12</span></div>${['60','150','400','1K','2.4K','6K','12K'].map((f,i)=>`<div class="eqcol"><div class="eqtrack"><i style="--pos:${[39,48,31,29,35,43,52][i]}%"></i></div><small>${f}</small></div>`).join('')}</div><div class="sect"><h2>Presets</h2><a>Zurücksetzen</a></div><div class="presetgrid">${['Flat','Bass Boost','Electronic','Techno','Pop','Vocal','Chill','Custom'].map(x=>`<span class="${x==='Electronic'?'on':''}">${x}</span>`).join('')}</div><div class="sect"><h2>Audioeffekte</h2></div><div class="settingrow"><div><b>Bass Boost</b><small>Mehr Tiefe für deine Beats</small></div><span class="toggle"><i></i></span></div><div class="settingrow"><div><b>Crossfade</b><small>Sanfte Übergänge zwischen Songs</small></div><span class="toggle"><i></i></span></div><p class="subhint">Designkonzept · Audioeffekte erfordern native Umsetzung</p>`,
themes:`<header class="simpletop"><span>‹</span><b>Designs</b><span>⚙</span></header><div class="hero minor"><div class="eyebrow">PREMIUM PERSONALISIERUNG</div><h1>Dein <em>Style.</em></h1><p>Mach den Player zu deinem.</p></div><div class="chips"><span class="on">Themes</span><span>Player</span><span>Visualizer</span><span>Hintergrund</span></div><div class="themegrid">${[['04_aurora','Aurora','AKTIV'],['03_party_hits','Sunset',''],['01_chill_vibes','Ocean',''],['06_neon_pulse','Midnight','♛'],['02_workout','Forest','♛'],['03_party_hits','Rose','♛'],['05_vinyl','Gold','♛'],['01_chill_vibes','Minimal','♛'],['06_neon_pulse','Cyber','♛']].map(([im,n,b])=>`<div class="theme"><div>${img(im)}${b?`<i>${b}</i>`:''}</div><b>${n}</b></div>`).join('')}</div><div class="themebottom">✦ &nbsp; Entdecke neue Premium-Designs</div>`,
visualizer:`<header class="simpletop"><span>‹</span><b>Visualizer</b><span>⋮</span></header><div class="hero minor"><div class="eyebrow">MUSIC IN MOTION</div><h1>Feel the <em>Beat.</em></h1><p>Musik, die du sehen kannst.</p></div><div class="selectp">◉ &nbsp; Aurora Waves <span>⌄</span></div><div class="viszone"><div class="orbit orbit1"></div><div class="orbit orbit2"></div><div class="viscore">${img('04_aurora')}</div></div><div class="vissettings"><div><span>Farbe</span><div class="visrange"><i style="width:62%"></i><b style="left:62%"></b></div></div><div><span>Intensität</span><div class="visrange"><i style="width:78%"></i><b style="left:78%"></b></div></div><div><span>Geschwindigkeit</span><div class="visrange"><i style="width:44%"></i><b style="left:44%"></b></div></div></div><div class="vismodes">${['06_neon_pulse','04_aurora','03_party_hits','01_chill_vibes'].map(n=>img(n)).join('')}</div><p class="subhint">Visuelle Vorschau · Audio-Reaktivität folgt in der Android-App</p>`,
premium:`<header class="simpletop"><span>‹</span><b>Premium</b><span>⋮</span></header><div class="premiumhero"><div class="crown">♛</div><h1>SoundWave<br><em>Premium.</em></h1><p>Mehr Sound. Mehr Möglichkeiten.<br>Deine perfekte Musikerfahrung.</p></div><div class="premiumbenefits">${[['☷','Professioneller Equalizer'],['✧','Exklusive Premium-Designs'],['◉','Visualizer & Effekte'],['▤','Smart Playlists'],['◈','Individueller Player'],['▥','Erweiterte Musikstatistiken']].map(([i,t])=>`<div><i>${i}</i><span>${t}</span><b>✓</b></div>`).join('')}</div><div class="premiumcta">Entdecke Premium &nbsp; ↗</div><div class="premiumplans"><div><strong>Monatlich</strong><small>Abonnement</small></div><div class="chosen"><strong>Jährlich</strong><small>Abonnement</small><i>Beliebt</i></div><div><strong>Lifetime</strong><small>Einmalkauf</small></div></div><p class="premiumfine">Preise und Laufzeiten werden vor dem Kauf in Google Play angezeigt. Diese Ansicht ist eine Designvorschau.</p>`
};
const k=new URLSearchParams(location.search).get('screen')||'home'; document.getElementById('content').innerHTML=screen[k]||screen.home;
const no=['player','eq','themes','visualizer','premium'].includes(k);document.getElementById('bottom').innerHTML=no?'':mini+nav(({home:'Home',discover:'Entdecken',library:'Bibliothek'})[k]||'Home');document.querySelector('.device').classList.add('screen-'+k);
</script></body></html>
